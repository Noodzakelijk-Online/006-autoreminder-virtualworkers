<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Joyce Browser Hygiene settings</title>
    <style>
      :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
      body { margin: 0; background: #0b0f17; color: #e7eaf0; }
      main { width: min(640px, calc(100% - 32px)); margin: 48px auto; }
      h1 { font-size: 22px; margin: 0 0 8px; }
      p { color: #9ca6b7; line-height: 1.5; }
      form { margin-top: 24px; display: grid; gap: 16px; padding: 20px; border: 1px solid #293142; border-radius: 8px; background: #111722; }
      label { display: grid; gap: 7px; font-size: 13px; font-weight: 650; }
      input { height: 38px; border: 1px solid #394357; border-radius: 6px; padding: 0 11px; background: #090d14; color: inherit; font: inherit; }
      .actions { display: flex; gap: 10px; }
      button { height: 38px; border: 1px solid #3b82f6; border-radius: 6px; padding: 0 14px; background: #2563eb; color: white; font-weight: 650; cursor: pointer; }
      button.secondary { background: transparent; color: #bfdbfe; }
      #status { min-height: 20px; font-size: 13px; }
      .ok { color: #34d399; } .error { color: #fb7185; }
    </style>
  </head>
  <body>
    <main>
      <h1>Joyce Browser Hygiene</h1>
      <p>Connect this Chrome profile to the local Joyce Work Schedule. The collector token is obtained automatically from the local dashboard. Tab titles and sanitized URLs stay in the local dashboard database.</p>
      <form id="settings-form">
        <label>Dashboard URL<input id="dashboard-url" type="url" required></label>
        <label>Collector label<input id="collector-label" type="text" maxlength="128" required></label>
        <label>Collector token (automatic)<input id="collector-token" type="password" autocomplete="off" placeholder="Obtained automatically from the dashboard"></label>
        <div class="actions"><button type="submit">Save</button><button type="button" class="secondary" id="test">Save and test</button></div>
        <div id="status" aria-live="polite"></div>
      </form>
    </main>
    <script src="options.js"></script>
  </body>
</html>
