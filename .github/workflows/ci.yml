name: Recovery quality gates

on:
  pull_request:
  push:
    branches:
      - main
      - "recovery/**"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: recovery_test
          MYSQL_USER: recovery
          MYSQL_PASSWORD: recovery_test
          MYSQL_ROOT_PASSWORD: root_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -urecovery -precovery_test --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    env:
      CI: "true"
      DATABASE_URL: mysql://recovery:recovery_test@127.0.0.1:3306/recovery_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.4.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Scan the release tree for secrets
        shell: bash
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f dir /repo --no-banner --redact
      - run: pnpm check
      - name: Apply canonical migrations
        run: pnpm exec drizzle-kit migrate
      - name: Verify consolidated schema parity
        run: pnpm db:verify-parity
      - run: pnpm test
      - run: pnpm build
      - name: Verify migration metadata matches the schema
        shell: bash
        run: |
          pnpm exec drizzle-kit generate --name ci-drift
          test -z "$(git status --porcelain -- drizzle)"
